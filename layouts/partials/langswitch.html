{{ $l := site.Language.Lang }}
{{ $page := . }}
<ul class="lang-switch" aria-label="{{ site.Params.langLabel }}">
  {{ range site.Home.AllTranslations }}
  {{ $lang := .Language.Lang }}
  {{ $target := . }}
  {{ range where $page.AllTranslations "Language.Lang" $lang }}{{ $target = . }}{{ end }}
  <li><a href="{{ $target.RelPermalink }}" hreflang="{{ $lang }}" lang="{{ $lang }}" title="{{ .Language.LanguageName }}"{{ if eq $lang $l }} aria-current="true"{{ end }}>{{ $lang }}</a></li>
  {{ end }}
</ul>
