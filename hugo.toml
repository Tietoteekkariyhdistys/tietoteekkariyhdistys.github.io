baseURL = '/'
languageCode = 'fi-FI'
title = 'Tietoteekkariyhdistys TTY'
defaultContentLanguage = 'fi'
timeZone = 'Europe/Helsinki'

[module]
  # Use the theme layouts only; its static terminal CSS and fonts are not shipped
  [[module.imports]]
    path = "hugo-theme-console"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
    [[module.imports.mounts]]
      source = "archetypes"
      target = "archetypes"


[params]
  bylawsPdf = "saannot.pdf"

  # Explorer tree. Folders in order; files link to pages (path is relative to the language root;
  # abs = true links to the single-language page without the language prefix).
  # File names are per language. The "guilds" folder is filled from data/guilds.yaml and the
  # "events" folder also lists the event pages.
  [[params.tree]]
  dir = "tty"
    [[params.tree.files]]
    path = ""
    name = { fi = "readme.md", sv = "readme.md", en = "readme.md" }
    [[params.tree.files]]
    path = "about/"
    name = { fi = "yhdistys.md", sv = "forening.md", en = "about.md" }
    [[params.tree.files]]
    path = "posts/"
    name = { fi = "tiedotteet.md", sv = "nyheter.md", en = "news.md" }
    [[params.tree.files]]
    path = "board/"
    name = { fi = "hallitus.md", sv = "styrelse.md", en = "board.md" }
    [[params.tree.files]]
    path = "members/"
    name = { fi = "jasenkillat.md", sv = "medlemsforeningar.md", en = "members.md" }
    [[params.tree.files]]
    path = "join/"
    name = { fi = "liity.md", sv = "bli-medlem.md", en = "join.md" }
    [[params.tree.files]]
    path = "photos/"
    name = { fi = "valokuvat.md", sv = "foton.md", en = "photos.md" }
    [[params.tree.files]]
    path = "contact/"
    name = { fi = "yhteystiedot.md", sv = "kontakt.md", en = "contact.md" }

  [[params.tree]]
  dir = "guilds"
  kind = "guilds"

  [[params.tree]]
  dir = "events"
  kind = "events"
    [[params.tree.files]]
    path = "events/"
    name = { fi = "tapahtumat.md", sv = "evenemang.md", en = "events.md" }

  [[params.tree]]
  dir = "docs"
    [[params.tree.files]]
    path = "documents/"
    name = { fi = "asiakirjat.md", sv = "dokument.md", en = "documents.md" }
    [[params.tree.files]]
    path = "bylaws/"
    abs = true
    name = { fi = "saannot.md", sv = "saannot.md", en = "bylaws.md" }
    [[params.tree.files]]
    path = "old-boards/"
    name = { fi = "vanhat-hallitukset.md", sv = "gamla-styrelser.md", en = "old-boards.md" }
    [[params.tree.files]]
    path = "privacy/"
    name = { fi = "tietosuoja.md", sv = "dataskydd.md", en = "privacy.md" }

